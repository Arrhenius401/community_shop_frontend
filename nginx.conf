# 基础Nginx配置
worker_processes  2;  # 工作进程数（根据CPU核心调整，1核设1）

events {
    worker_connections  1024;  # 每个进程最大连接数
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 优化静态资源传输（适配文档“高效访问”）
    sendfile        on;
    keepalive_timeout  65;  # 长连接超时时间

    server {
        listen       80;  # 前端容器暴露80端口（用户访问端口）
        server_name  localhost;  # 域名（生产环境可替换为实际域名，如www.community-trade.com）

        # 托管前端静态资源（指向编译后的dist目录）
        location / {
            root   /usr/share/nginx/html;  # Nginx容器中静态资源目录
            index  index.html;
            try_files $uri $uri/ /index.html;  # 解决Vue路由刷新404问题（SPA必备）
        }

        # 反向代理后端API（匹配/api/v1前缀，转发到后端服务）
        location /api/v1 {
            proxy_pass https://backend:8090;  # 后端服务名:端口（与Docker Compose一致）
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;  # 传递真实IP（便于后端日志排查）
        }

        # 静态资源缓存优化（适配文档“性能优化”）
        location ~* \.(css|js|png|jpg|jpeg|gif|ico)$ {
            root /usr/share/nginx/html;
            expires 7d;  # 静态资源缓存7天，减少重复请求
        }
    }
}